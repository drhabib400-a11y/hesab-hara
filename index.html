<script>
const $=s=>document.querySelector(s), fa=n=>Number(n||0).toLocaleString('fa-IR'), money=n=>`<bdi class="num-ltr">${Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}</bdi> <span dir="rtl">تومان</span>`;
const today=()=>new Intl.DateTimeFormat('en-CA-u-ca-persian',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const jalali=()=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{timeZone:'Asia/Tehran',weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date());
function jalaliParts(date){let p=new Intl.DateTimeFormat('en-US-u-ca-persian',{timeZone:'UTC',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date),o={};p.forEach(x=>o[x.type]=x.value);return {y:+o.year,m:+o.month,d:+o.day};}
function showDate(iso){if(!iso)return '';let a=String(iso).slice(0,10).split('-').map(Number);if(a.length!==3||!a[0])return iso;let p=jalaliParts(new Date(Date.UTC(a[0],a[1]-1,a[2],12)));return `<bdi class="num-ltr">${p.y}/${String(p.m).padStart(2,'0')}/${String(p.d).padStart(2,'0')}</bdi>`;}
function jalaliToday(){let a=new Intl.DateTimeFormat('en-US-u-ca-persian',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o={};a.forEach(x=>o[x.type]=x.value);return `${o.year}/${String(o.month).padStart(2,'0')}/${String(o.day).padStart(2,'0')}`;}
function jalaliToISO(value){let v=String(value||'').trim().replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));let m=v.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);if(!m)return null;let y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return null;let start=Date.UTC(y+621,2,18,12);for(let i=0;i<370;i++){let dt=new Date(start+i*86400000),q=jalaliParts(dt);if(q.y===y&&q.m===mo&&q.d===d)return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`;}return null;}
function normalizeDigits(v){return String(v||'').replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));}
function formatMoneyField(el,keepCaret=false){let pos=el.selectionStart??el.value.length,before=normalizeDigits(el.value.slice(0,pos)).replace(/[^\d]/g,'').length,digits=normalizeDigits(el.value).replace(/[^\d]/g,''),formatted=digits.replace(/\B(?=(\d{3})+(?!\d))/g,',');el.value=formatted;if(keepCaret&&typeof el.setSelectionRange==='function'){let i=0,count=0;while(i<formatted.length&&count<before){if(/[0-9]/.test(formatted[i]))count++;i++;}el.setSelectionRange(i,i);}}
function bindFormattedFields(){document.querySelectorAll('.jalali-date').forEach(el=>{el.placeholder='انتخاب از تقویم';el.title='برای انتخاب تاریخ، تقویم را باز کنید';el.inputMode='none';el.readOnly=true;el.setAttribute('aria-readonly','true');el.style.cursor='pointer';el.dir='ltr';el.style.textAlign='left';if(!el.value)el.value=jalaliToday();el.onclick=()=>toggleCalendar(undefined,el);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleCalendar(undefined,el);}};});document.querySelectorAll('.money-input').forEach(el=>{el.inputMode='numeric';el.dir='ltr';el.addEventListener('focus',()=>el.value=normalizeDigits(el.value).replace(/,/g,''));el.addEventListener('input',()=>formatMoneyField(el,true));el.addEventListener('blur',()=>formatMoneyField(el,false));});}
function rawAmount(v){let s=normalizeDigits(v);return Number(s.replace(/,/g,'').replace(/[^\d.-]/g,''))||0;}

function newId(){return (window.crypto&&typeof window.crypto.randomUUID==='function')?window.crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}

let calcState={display:'0',stored:null,operator:null,replace:false};
function calcRaw(){return Number(String(calcState.display).replace(/,/g,''));}
function calcFormat(n){if(!Number.isFinite(n))return 'خطا';let rounded=Math.round((n+Number.EPSILON)*1e8)/1e8;return rounded.toLocaleString('en-US',{maximumFractionDigits:8});}
function calcPaint(){document.querySelectorAll('[data-calc-display]').forEach(e=>e.textContent=calcFormat(calcRaw()));}
function calcCompute(a,op,b){if(op==='+')return a+b;if(op==='-')return a-b;if(op==='×')return a*b;if(op==='÷')return b===0?NaN:a/b;return b;}
function calcPress(key){
 if(key==='AC'){calcState={display:'0',stored:null,operator:null,replace:false};calcPaint();return;}
 if(key==='DEL'){if(calcState.replace){calcState.display='0';calcState.replace=false;}else{let v=calcState.display.replace(/,/g,'');calcState.display=v.length>1?v.slice(0,-1):'0';}calcPaint();return;}
 if(key>='0'&&key<='9'){let v=calcState.display.replace(/,/g,'');calcState.display=(calcState.replace||v==='0')?key:v+key;calcState.replace=false;calcPaint();return;}
 if(key==='.'){let v=calcState.display.replace(/,/g,'');if(calcState.replace)v='0';if(!v.includes('.'))v+='.';calcState.display=v;calcState.replace=false;calcPaint();return;}
 if(key==='±'){let v=calcRaw();calcState.display=String(-v);calcPaint();return;}
 if(key==='%'){calcState.display=String(calcRaw()/100);calcPaint();return;}
 if(['+','-','×','÷'].includes(key)){
   let current=calcRaw();if(calcState.operator&&!calcState.replace){let next=calcCompute(calcState.stored,calcState.operator,current);if(!Number.isFinite(next)){calcState.display='0';calcState.stored=null;calcState.operator=null;calcState.replace=true;calcPaint();toast('تقسیم بر صفر ممکن نیست');return;}calcState.display=String(next);current=next;}
   calcState.stored=current;calcState.operator=key;calcState.replace=true;calcPaint();return;
 }
 if(key==='='){if(calcState.operator&&calcState.stored!==null){let result=calcCompute(calcState.stored,calcState.operator,calcRaw());if(!Number.isFinite(result)){calcState.display='0';toast('تقسیم بر صفر ممکن نیست');}else calcState.display=String(Math.round((result+Number.EPSILON)*1e8)/1e8);calcState.stored=null;calcState.operator=null;calcState.replace=true;calcPaint();}
 }
}
function bindCalculator(){document.querySelectorAll('[data-calc-keys]').forEach(keys=>{keys.onclick=e=>{let b=e.target.closest('[data-calc]');if(b)calcPress(b.dataset.calc);};});calcPaint();}
function toggleFloatingCalc(force){let box=$('#floating-calc');if(!box)return;let open=typeof force==='boolean'?force:!box.classList.contains('open');box.classList.toggle('open',open);if(open)calcPaint();}
function bindCalcDrag(){let box=$('#floating-calc'),handle=$('#calc-drag-handle');if(!box||!handle)return;let drag=null;handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;let r=box.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};handle.setPointerCapture(e.pointerId);});handle.addEventListener('pointermove',e=>{if(!drag)return;let x=Math.max(4,Math.min(innerWidth-box.offsetWidth-4,e.clientX-drag.x)),y=Math.max(4,Math.min(innerHeight-box.offsetHeight-4,e.clientY-drag.y));box.style.left=x+'px';box.style.top=y+'px';box.style.right='auto';box.style.bottom='auto';});handle.addEventListener('pointerup',()=>drag=null);handle.addEventListener('pointercancel',()=>drag=null);}

let clockOverrideDate=null, clockOverrideTime=null, calendarMonth=null, activeDateInput=null;
const jalaliMonths=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const weekDays=['ش','ی','د','س','چ','پ','ج'];
function datePartsFromISO(iso){
 let a=String(iso).slice(0,10).split('-').map(Number);
 return jalaliParts(new Date(Date.UTC(a[0],a[1]-1,a[2],12)));
}
function isoToJalaliText(iso){
 let p=datePartsFromISO(iso);
 return `${p.y}/${String(p.m).padStart(2,'0')}/${String(p.d).padStart(2,'0')}`;
}
function isoTodayTehran(){
 let f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'});
 return f.format(new Date());
}
function findJalaliMonthStart(y,m){
 let guess=Date.UTC(y+621,2,18,12);
 for(let i=-20;i<40;i++){
  let d=new Date(guess+i*86400000),p=jalaliParts(d);
  if(p.y===y&&p.m===m&&p.d===1)return d;
 }
 return new Date(guess);
}
function drawCalendar(){
 let pop=$('#calendar-pop');if(!pop)return;
 let p=calendarMonth||datePartsFromISO(clockOverrideDate||isoTodayTehran());
 let first=findJalaliMonthStart(p.y,p.m), offset=(first.getUTCDay()+1)%7;
 let days=[];
 for(let i=0;i<42;i++){
  let d=new Date(first.getTime()+(i-offset)*86400000),q=jalaliParts(d);
  if(q.y===p.y&&q.m===p.m)days.push({d:q.d,iso:`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`});
  else days.push(null);
 }
 let selected=activeDateInput?(jalaliToISO(activeDateInput.value)||isoTodayTehran()):(clockOverrideDate||isoTodayTehran()), today=isoTodayTehran();
 pop.innerHTML=`<div class="calendar-head"><button type="button" onclick="moveCalendar(-1)">ماه قبل</button><b>${jalaliMonths[p.m-1]} ${fa(p.y)}</b><button type="button" onclick="moveCalendar(1)">ماه بعد</button></div>
 <div class="calendar-grid">${weekDays.map(x=>`<span>${x}</span>`).join('')}${days.map(x=>x?`<button type="button" class="calendar-day ${x.iso===selected?'selected':''} ${x.iso===today?'today':''}" onclick="chooseClockDate('${x.iso}')">${fa(x.d)}</button>`:'<i></i>').join('')}</div>
 <div style="display:flex;justify-content:space-between;margin-top:9px"><button type="button" class="btn light" onclick="chooseClockDate('${today}')">امروز</button><button type="button" class="btn light" onclick="toggleCalendar(false)">بستن</button></div>`;
}
function moveCalendar(delta){
 let p=calendarMonth||datePartsFromISO(clockOverrideDate||isoTodayTehran());
 let m=p.m+delta,y=p.y;if(m<1){m=12;y--}if(m>12){m=1;y++}
 calendarMonth={y,m,d:1};drawCalendar();
}
function toggleCalendar(force,target){
 let pop=$('#calendar-pop');if(!pop)return;
 let open=typeof force==='boolean'?force:!pop.classList.contains('open');
 if(open){
  activeDateInput=target||null;
  let seed=activeDateInput?(jalaliToISO(activeDateInput.value)||isoTodayTehran()):(clockOverrideDate||isoTodayTehran());
  calendarMonth=datePartsFromISO(seed);drawCalendar();
  let anchor=activeDateInput||$('#date-trigger');
  if(anchor){let r=anchor.getBoundingClientRect();pop.style.position='fixed';pop.style.left=Math.max(8,Math.min(window.innerWidth-320,r.left))+'px';pop.style.right='auto';pop.style.top=Math.min(window.innerHeight-330,r.bottom+6)+'px';}
 }else{activeDateInput=null;}
 pop.classList.toggle('open',open);
}
function chooseClockDate(iso){
 if(activeDateInput){
  activeDateInput.value=isoToJalaliText(iso);
  activeDateInput.dispatchEvent(new Event('change',{bubbles:true}));
 }else{
  clockOverrideDate=iso;
  let d=$('#date');if(d)d.textContent=jalaliDateForISO(iso);
  let b=$('#date-trigger');if(b)b.textContent=isoToJalaliText(iso);
 }
 toggleCalendar(false);
}
function jalaliDateForISO(iso){
 let p=datePartsFromISO(iso),dt=new Date(iso+'T12:00:00Z');
 let weekday=new Intl.DateTimeFormat('fa-IR',{weekday:'long',timeZone:'UTC'}).format(dt);
 return `${weekday}، ${fa(p.d)} ${jalaliMonths[p.m-1]} ${fa(p.y)}`;
}
function setClockTime(v){
 if(!/^\d{2}:\d{2}$/.test(v))return;
 clockOverrideTime=v;
}
function home(){
 const income=sum('income'), purchases=sum('purchase'), expenses=sum('expense');
 const out=purchases+expenses, net=income-out;
 const items=listItems().slice(0,5);
 const upcoming=state.reminders.slice().filter(r=>{
   const target=reminderTarget(r);
   return Number.isFinite(target) && target>=Date.now()-86400000;

function reminderTarget(r){let a=String(r.date||'').split('-').map(Number),t=String(r.time||'00:00').split(':').map(Number);if(a.length!==3||!a[0])return NaN;return Date.UTC(a[0],a[1]-1,a[2],(t[0]||0)-3,(t[1]||0)-30);}
function reminderAlert(r,kind){let title=kind==='before'?'۱۰ دقیقه تا یادآوری':'زمان یادآوری فرا رسیده';let body=(r.title||'یادآوری')+(r.note?' — '+r.note:'');toast(title+' | '+body);try{if('Notification'in window&&Notification.permission==='granted'){let n=new Notification(title,{body,tag:'habib-'+r.id+'-'+kind,renotify:false});n.onclick=()=>{window.focus();page('reminders');n.close();};}}catch(e){}try{let C=window.AudioContext||window.webkitAudioContext;if(C){let c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=kind==='before'?660:880;g.gain.value=.12;o.start();o.stop(c.currentTime+.35);o.onended=()=>c.close();}}catch(e){}}
function checkReminders(){let now=Date.now(),changed=false;for(let r of state.reminders){let target=reminderTarget(r);if(!Number.isFinite(target))continue;r.alerts=Array.isArray(r.alerts)?r.alerts:[];if(now>=target-600000&&!r.alerts.includes('before')){r.alerts.push('before');changed=true;reminderAlert(r,'before');}if(now>=target&&!r.alerts.includes('due')){r.alerts.push('due');changed=true;reminderAlert(r,'due');}if(now>target+86400000&&r.alerts.length<2){r.alerts=['before','due'];changed=true;}}if(changed)save();}

function tick(){
 let d=new Date(),parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tehran',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d),v={};
 parts.forEach(p=>v[p.type]=p.value);
 let h=+v.hour,m=+v.minute,s=+v.second;
 if(clockOverrideTime){
  let [oh,om]=clockOverrideTime.split(':').map(Number);
  h=oh;m=om;s=0;
 }
 let timeText=`${fa(h)}:${fa(m)}:${fa(s)}`;
 let dateText=clockOverrideDate?jalaliDateForISO(clockOverrideDate):jalali();
 let t=$('#time');if(t)t.textContent=timeText;
 let dt=$('#date');if(dt)dt.textContent=dateText;
 let md=$('#mini-date');if(md)md.textContent=dateText;
 [['hh',h*30+m*.5],['mm',m*6+s*.1],['ss',s*6],['mini-hh',h*30+m*.5],['mini-mm',m*6+s*.1],['mini-ss',s*6]].forEach(([id,deg])=>{let el=$('#'+id);if(el)el.style.transform=`translateX(-50%) rotate(${deg}deg)`});
}
setInterval(tick,1000);
document.addEventListener('click',e=>{let pop=$('#calendar-pop');if(pop&&pop.classList.contains('open')&&!e.target.closest('#calendar-pop')&&!e.target.closest('.jalali-date')&&!e.target.closest('#date-trigger'))toggleCalendar(false);});
home();tick();bindCalcDrag();checkReminders();setInterval(checkReminders,15000);
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
let deferredInstallPrompt=null;
const installButton=document.getElementById('install-app');
const installHelp=document.getElementById('install-help');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;if(installButton)installButton.hidden=false;});
if(installButton)installButton.addEventListener('click',async()=>{if(!deferredInstallPrompt){showInstallHelp();return;}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installButton.hidden=true;});
function showInstallHelp(){alert('برای نصب: صفحه را در Google Chrome و از نشانی اینترنتی امن (https) باز کنید. سپس منوی سه‌نقطه را بزنید و گزینه «نصب برنامه» یا «افزودن به صفحه اصلی» را انتخاب کنید. اگر این گزینه دیده نمی‌شود، صفحه را یک‌بار تازه‌سازی کنید و مطمئن شوید همه فایل‌های برنامه کنار هم روی سایت بارگذاری شده‌اند.');}
if(installHelp)installHelp.addEventListener('click',showInstallHelp);
window.addEventListener('appinstalled',()=>{if(installButton)installButton.hidden=true;toast('حسابداری حبیب نصب شد');});
if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone){if(installButton)installButton.hidden=true;}
</script>
